<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Ask Free 主窗口 · 方向 B</title><style>
:root{
  --bg:#FAFAFB;--surface:#F4F4F6;--elevated:#FFFFFF;--hover:rgba(0,0,0,.04);--selected:rgba(0,0,0,.07);
  --border:rgba(0,0,0,.09);--border2:rgba(0,0,0,.16);
  --text:#18191C;--text2:#5F636C;--text3:#969AA2;
  --ink:#18191C;--on-ink:#FFFFFF;
  --ok:#28965A;--ok-soft:rgba(40,150,90,.12);--warn:#CD7D14;--warn-soft:rgba(205,125,20,.12);--danger:#C83C3C;
  --mark:#E5484D;
  --desk:linear-gradient(160deg,#dfe3ec 0%,#cfd5e2 55%,#c4cad8 100%);
  --menubar:rgba(246,246,248,.78);
  --win-shadow:0 0 0 .5px rgba(0,0,0,.18),0 22px 60px -10px rgba(20,22,40,.35),0 6px 16px rgba(20,22,40,.12);
  --pop-shadow:0 0 0 .5px rgba(0,0,0,.12),0 12px 32px -6px rgba(20,22,40,.28);
  --stage:#EEEFF2;--paper:#FFFFFF;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Segoe UI",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
:root[data-theme="dark"]{
  --bg:#16171A;--surface:#1C1D20;--elevated:#232428;--hover:rgba(255,255,255,.05);--selected:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.15);
  --text:#EDEDEF;--text2:#9A9FA8;--text3:#6E7480;
  --ink:#EDEDEF;--on-ink:#16171A;
  --ok:#5CC285;--ok-soft:rgba(92,194,133,.15);--warn:#F29E40;--warn-soft:rgba(242,158,64,.15);--danger:#E65C5C;
  --mark:#F2555A;
  --desk:linear-gradient(160deg,#20232c 0%,#191b22 55%,#131419 100%);
  --menubar:rgba(30,31,36,.78);
  --win-shadow:0 0 0 .5px rgba(255,255,255,.12),0 22px 60px -10px rgba(0,0,0,.7),0 6px 16px rgba(0,0,0,.35);
  --pop-shadow:0 0 0 .5px rgba(255,255,255,.12),0 12px 32px -6px rgba(0,0,0,.6);
  --stage:#1E1F23;--paper:#2A2B30;
}
*{box-sizing:border-box}
html,body{margin:0;width:1440px;height:900px;overflow:hidden}
body{font:13px/1.5 var(--sans);color:var(--text);-webkit-font-smoothing:antialiased;text-autospace:normal;font-kerning:normal;letter-spacing:0;user-select:none}
button{font:inherit;color:inherit}
.desk{position:absolute;inset:0;background:var(--desk)}
.mbar{position:absolute;left:0;right:0;top:0;height:26px;background:var(--menubar);backdrop-filter:blur(20px);display:flex;align-items:center;padding:0 14px;gap:20px;font-size:13px;z-index:40}
.mbar b{font-weight:600}
.mbar .sp{flex:1}
.mbar .mic{display:flex;align-items:center;justify-content:center;width:28px;height:22px;border-radius:5px;cursor:default}
.mbar .mic.on,.mbar .mic:hover{background:var(--selected)}
.mbar .clock{font-variant-numeric:tabular-nums}
/* windows */
.win{position:absolute;background:var(--bg);border-radius:10px;box-shadow:var(--win-shadow);overflow:hidden;display:flex}
.tl{position:absolute;left:14px;top:16px;display:flex;gap:8px;z-index:5}
.tl i{width:12px;height:12px;border-radius:999px;background:#FF5F57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.tl i:nth-child(2){background:#FEBC2E}.tl i:nth-child(3){background:#28C840}
.win.inactive .tl i{background:var(--border2)}
.side{width:216px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:48px 10px 10px}
.nav{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:6px;color:var(--text);cursor:default;position:relative}
.nav svg{color:var(--text2);flex:none}
.nav.on{background:var(--selected)}
.nav.on svg{color:var(--text)}
.nav .n{margin-left:auto;font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums}
.nav .dot{margin-left:auto}
.gt{font-size:12px;font-weight:500;color:var(--text2);margin:18px 10px 6px}
.side .gt{margin-top:16px}
.dot{width:7px;height:7px;border-radius:999px;display:inline-block;flex:none}
.dot.warn{background:var(--warn)}.dot.ok{background:var(--ok)}.dot.danger{background:var(--danger)}.dot.off{background:var(--text3)}
.statuscard{margin-top:auto;background:var(--elevated);border:1px solid var(--border);border-radius:8px;padding:10px 12px;cursor:default}
.statuscard .t{display:flex;align-items:center;gap:8px;font-weight:500}
.statuscard .s{font-size:12px;color:var(--text2);margin-top:2px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.hdr{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 24px;border-bottom:1px solid var(--border)}
.hdr h1{font-size:17px;font-weight:600;margin:0}
.hdr .sp{flex:1}
.body{flex:1;overflow:auto;padding:24px 32px 40px}
.body::-webkit-scrollbar{width:8px}.body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.wrap{max-width:720px;margin:0 auto}
/* basics */
.btn{height:28px;padding:0 12px;border-radius:6px;border:1px solid var(--border2);background:var(--elevated);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;cursor:default;white-space:nowrap;flex:none}
.btn.solid{background:var(--ink);color:var(--on-ink);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text2)}
.btn.sm{height:24px;padding:0 9px;font-size:12px}
.btn[disabled]{opacity:.45}
.ibtn{width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--text2);cursor:default;flex:none}
.ibtn:hover{background:var(--hover);color:var(--text)}
.link{color:var(--text);text-decoration:underline;text-decoration-color:var(--border2);text-underline-offset:3px;cursor:default}
.muted{color:var(--text2)}.faint{color:var(--text3)}.small{font-size:12px}
.group{background:var(--elevated);border:1px solid var(--border);border-radius:8px}
.row{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 16px;border-top:1px solid var(--border)}
.row:first-child{border-top:0}
.row .tx{flex:1;min-width:0}
.row .tx .a{font-weight:500}
.row .tx .b{font-size:12px;color:var(--text2);margin-top:1px}
.tg{width:32px;height:18px;border-radius:5px;background:var(--border2);position:relative;flex:none;cursor:default;transition:background .15s}
.tg i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:3px;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tg.on{background:var(--ink)}.tg.on i{left:16px;background:var(--on-ink)}
.tg.dis{opacity:.4}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:2px;gap:2px;flex:none}
.seg b{height:22px;padding:0 10px;border-radius:4px;font-size:12px;font-weight:500;display:flex;align-items:center;color:var(--text2);cursor:default}
.seg b.on{background:var(--elevated);color:var(--text);box-shadow:0 0 0 .5px var(--border2),0 1px 2px rgba(0,0,0,.06)}
.seg.dis{opacity:.45}
.kc{min-width:28px;height:28px;padding:0 9px;border-radius:5px;border:1px solid var(--border2);border-bottom-width:2px;background:var(--elevated);font-size:13px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;cursor:default;flex:none}
.kc.unset{border-style:dashed;border-bottom-width:1px;color:var(--text2);font-weight:400}
.kc .car{color:var(--text3);font-size:10px}
.kc.big{height:38px;min-width:38px;font-size:15px;padding:0 12px}
.q{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:5px;background:var(--surface);border:1px solid var(--border);font-size:12px;white-space:nowrap}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:5px;font-size:12px;background:var(--surface);color:var(--text2);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}
.field{height:28px;border-radius:6px;border:1px solid var(--border2);background:var(--bg);padding:0 9px;font:13px var(--sans);color:var(--text);outline:none;min-width:0}
.field:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--selected)}
.field.mono{font-family:var(--mono);font-size:12px}
.field::placeholder{color:var(--text3)}
.menu{position:absolute;background:var(--elevated);border-radius:8px;box-shadow:var(--pop-shadow);padding:4px;min-width:200px;z-index:80;font-size:13px}
.menu .mi{height:26px;padding:0 10px;border-radius:5px;display:flex;align-items:center;gap:10px;cursor:default;white-space:nowrap}
.menu .mi:hover{background:var(--selected)}
.menu .mi .r{margin-left:auto;color:var(--text3);font-size:12px}
.menu .mi.dim{color:var(--text3)}
.menu .mi.danger{color:var(--danger)}
.menu .sep{height:1px;background:var(--border);margin:4px 6px}
.menu .mh{font-size:12px;color:var(--text3);padding:4px 10px 2px}
.toast{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:8px 14px;border-radius:8px;font-size:13px;z-index:90;box-shadow:var(--pop-shadow);display:flex;gap:10px;align-items:center;white-space:nowrap;animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
/* stage + demo */
.stage{position:relative;height:208px;background:var(--stage);border-radius:10px;overflow:hidden;flex:none}
.stage .page{position:absolute;left:24px;top:18px;width:300px;height:150px;background:var(--paper);border-radius:8px;box-shadow:0 0 0 .5px var(--border2),0 4px 14px rgba(0,0,0,.06);padding:12px 14px}
.stage .page .tt{font-size:12px;font-weight:600}
.stage .page .st{font-size:11px;color:var(--text3)}
.bars{position:absolute;left:14px;right:14px;bottom:24px;height:96px;display:flex;align-items:flex-end;gap:12px}
.bars i{flex:1;background:var(--text3);opacity:.45;border-radius:2px 2px 0 0}
.bars i.hi{background:var(--text);opacity:.85}
.months{position:absolute;left:14px;right:14px;bottom:8px;display:flex;gap:12px;font-size:10px;color:var(--text3)}
.months span{flex:1;text-align:center}
.frame{position:absolute;border:1.5px solid var(--mark);border-radius:3px;opacity:0}
.cursor{position:absolute;width:16px;height:22px;z-index:3}
.capsule{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);height:34px;border-radius:999px;background:#18191C;color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px 0 12px;font-size:12px;opacity:0;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.capsule .wave{display:flex;gap:2px;align-items:center;height:16px}
.capsule .wave i{width:3px;border-radius:2px;background:linear-gradient(#7AA2FF,#C77DFF);animation:wv .6s ease-in-out infinite alternate}
.capsule.mono .wave i{background:#fff}
.capsule .wave i:nth-child(2){animation-delay:.1s}.capsule .wave i:nth-child(3){animation-delay:.25s}.capsule .wave i:nth-child(4){animation-delay:.05s}.capsule .wave i:nth-child(5){animation-delay:.3s}.capsule .wave i:nth-child(6){animation-delay:.15s}
@keyframes wv{from{height:4px}to{height:16px}}
.capsule .cb{width:20px;height:20px;border-radius:999px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:11px}
.apanel{position:absolute;right:20px;top:18px;width:250px;background:var(--elevated);border-radius:12px;box-shadow:var(--pop-shadow);padding:12px 14px;opacity:0;font-size:12px}
.apanel .h{display:flex;align-items:center;gap:6px;color:var(--text3);font-size:11px;margin-bottom:6px}
.apanel .qq{font-weight:500;margin-bottom:4px;font-size:12px}
.apanel .aa{color:var(--text);line-height:1.6}
.presskey{position:absolute;right:24px;bottom:18px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);opacity:0}
.presskey .kc{background:var(--elevated)}
.stage.play .cursor{animation:cur 7s ease-in-out infinite}
.stage.play .frame{animation:frm 7s infinite}
.stage.play .capsule{animation:cap 7s infinite}
.stage.play .apanel{animation:ans 7s infinite}
.stage.play .presskey{animation:prk 7s infinite}
.stage.play .typed{animation:typ 7s steps(9) infinite;overflow:hidden;display:inline-block;white-space:nowrap;vertical-align:bottom}
@keyframes cur{0%{left:330px;top:170px;opacity:0}6%{opacity:1}18%{left:236px;top:66px}86%{left:236px;top:66px;opacity:1}96%{opacity:0}100%{left:330px;top:170px;opacity:0}}
@keyframes frm{0%,20%{opacity:0;transform:scale(1.15)}24%{opacity:1;transform:scale(1)}86%{opacity:1}94%,100%{opacity:0}}
@keyframes cap{0%,20%{opacity:0;transform:translate(-50%,8px)}24%{opacity:1;transform:translate(-50%,0)}52%{opacity:1;transform:translate(-50%,0)}56%,100%{opacity:0;transform:translate(-50%,8px)}}
@keyframes prk{0%,16%{opacity:0}20%{opacity:1}52%{opacity:1}55%,100%{opacity:0}}
@keyframes typ{0%,26%{width:0}48%,100%{width:9.2em}}
@keyframes ans{0%,56%{opacity:0;transform:translateY(-6px)}61%{opacity:1;transform:translateY(0)}90%{opacity:1}96%,100%{opacity:0}}
.stage.still .cursor{left:236px;top:66px}
.stage.still .frame,.stage.still .apanel{opacity:1}
/* setup steps */
.steps{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--elevated)}
.step{display:flex;gap:14px;padding:16px 18px;border-top:1px solid var(--border);align-items:flex-start}
.step:first-child{border-top:0}
.step.cur{background:var(--surface)}
.step .num{width:26px;height:26px;border-radius:999px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--text2);flex:none;margin-top:1px}
.step.cur .num{background:var(--ink);color:var(--on-ink);border-color:transparent}
.step.done .num{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.step .tx{flex:1;min-width:0}
.step .tx .a{font-weight:500;font-size:14px}
.step.done .tx .a{color:var(--text2)}
.step .tx .b{font-size:12px;color:var(--text2);margin-top:2px}
.sub{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.subrow{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:6px;background:var(--elevated);border:1px solid var(--border)}
.step.cur .subrow{background:var(--elevated)}
.subrow .nm{width:72px;font-weight:500}
.subrow .why{flex:1;font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ok-t{color:var(--ok);font-size:12px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.warn-t{color:var(--warn);font-size:12px;white-space:nowrap}
.danger-t{color:var(--danger);font-size:12px}
/* providers */
.prov{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 16px;border-top:1px solid var(--border);cursor:default}
.prov:first-child{border-top:0}
.radio{width:16px;height:16px;border-radius:999px;border:1.5px solid var(--border2);flex:none;position:relative}
.radio.on{border-color:var(--ink)}
.radio.on:after{content:"";position:absolute;inset:3px;border-radius:999px;background:var(--ink)}
.prov .nm{font-weight:500}
.prov .ds{color:var(--text2);font-size:12px}
.provx{padding:4px 16px 16px 44px;display:flex;flex-direction:column;gap:10px;border-top:0}
.frow{display:flex;align-items:center;gap:10px}
.frow .lb{width:64px;font-size:12px;color:var(--text2);flex:none}
.flow{display:flex;align-items:center;justify-content:center;gap:10px;height:100%}
.fnode{display:flex;flex-direction:column;align-items:center;gap:6px;width:118px}
.fnode .ic{width:46px;height:46px;border-radius:12px;background:var(--elevated);box-shadow:0 0 0 .5px var(--border2),0 2px 6px rgba(0,0,0,.05);display:flex;align-items:center;justify-content:center;position:relative}
.fnode .ic .st{position:absolute;right:-4px;top:-4px;width:16px;height:16px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
.fnode .l1{font-size:12px;font-weight:500}
.fnode .l2{font-size:12px;color:var(--text2);margin-top:-4px}
.farrow{width:44px;height:2px;background:var(--border2);position:relative;margin-bottom:34px}
.farrow:after{content:"";position:absolute;right:-1px;top:-3px;border-left:6px solid var(--border2);border-top:4px solid transparent;border-bottom:4px solid transparent}
.farrow.go{background:linear-gradient(90deg,var(--border2) 0 40%,var(--ink) 40% 60%,var(--border2) 60%);background-size:200% 100%;animation:flowmv 1.6s linear infinite}
@keyframes flowmv{from{background-position:100% 0}to{background-position:-100% 0}}
/* history */
.hl{width:330px;flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.hl .top{padding:12px 14px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--border)}
.search{display:flex;align-items:center;gap:6px;height:28px;border-radius:6px;background:var(--surface);border:1px solid var(--border);padding:0 8px;color:var(--text3)}
.search input{border:0;background:transparent;outline:none;flex:1;font:13px var(--sans);color:var(--text);min-width:0}
.search input::placeholder{color:var(--text3)}
.search:focus-within{border-color:var(--border2);background:var(--elevated)}
.chips{display:flex;gap:4px}
.chip{height:24px;padding:0 9px;border-radius:6px;font-size:12px;color:var(--text2);display:inline-flex;align-items:center;gap:5px;cursor:default}
.chip.on{background:var(--selected);color:var(--text);font-weight:500}
.hlist{flex:1;overflow:auto;padding:4px 8px 16px}
.hlist::-webkit-scrollbar{width:8px}.hlist::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.dayh{font-size:12px;font-weight:500;color:var(--text2);padding:12px 8px 4px;display:flex;gap:6px}
.dayh .c{color:var(--text3);font-weight:400}
.hrow{display:flex;gap:10px;padding:8px 8px;border-radius:8px;align-items:flex-start;cursor:default}
.hrow.on{background:var(--selected)}
.hrow .mi{width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:var(--text3);flex:none;margin-top:0}
.hrow .tx{flex:1;min-width:0}
.hrow .q1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .p1{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .rt{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.hrow .tm{font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums;width:40px;text-align:right}
.hrow .tn{font-size:12px;color:var(--text3)}
mark{background:var(--warn-soft);color:inherit;border-radius:2px;padding:0 1px}
.hd{flex:1;min-width:0;display:flex;flex-direction:column}
.hd .bar{height:44px;display:flex;align-items:center;justify-content:flex-end;gap:2px;padding:0 14px;flex:none}
.hd .sc{flex:1;overflow:auto;padding:0 32px 32px}
.hd .sc::-webkit-scrollbar{width:8px}.hd .sc::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.hd h2{font-size:17px;font-weight:600;line-height:1.35;margin:0 0 6px}
.meta{font-size:12px;color:var(--text2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meta .sepd{color:var(--text3)}
.turn{margin-top:18px}
.turn .lab{font-size:12px;color:var(--text3);margin-bottom:4px;display:flex;gap:6px;align-items:center}
.turn .qq{font-weight:500;font-size:14px;margin-bottom:8px}
.answer{line-height:1.65;font-size:13px}
.answer p{margin:0 0 8px}
.answer ol,.answer ul{margin:0 0 8px;padding-left:20px}
.answer code{font:12px var(--mono);background:var(--surface);border-radius:4px;padding:1px 4px}
.shot{position:relative;width:100%;max-width:440px;height:170px;border-radius:8px;overflow:hidden;background:var(--stage);border:1px solid var(--border);margin:4px 0 12px;cursor:zoom-in}
.imgs{display:flex;gap:8px;margin:6px 0 4px}
.img{width:120px;height:84px;border-radius:6px;overflow:hidden;border:1px solid var(--border);position:relative;cursor:default}
.img .cap{position:absolute;left:0;right:0;bottom:0;font-size:11px;color:#fff;padding:3px 6px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;height:100%;padding:24px}
.empty svg{opacity:.6;color:var(--text2)}
.empty .a{font-weight:500}
.empty .b{font-size:12px;color:var(--text2);max-width:46ch}

  const mv = ev => { g.style.left = ev.clientX - 22 + "px"; g.style.top = ev.clientY - 22 + "px"; const l = document.getElementById("syslist"); if (l) { const r = l.getBoundingClientRect(); l.classList.toggle("hot", ev.clientX > r.left && ev.clientX < r.right && ev.clientY > r.top - 20 && ev.clientY < r.bottom + 40); } };
  mv(e);
  const up = ev => {
    document.removeEventListener("mousemove", mv); document.removeEventListener("mouseup", up); g.remove();
    const l = document.getElementById("syslist"); const r = l && l.getBoundingClientRect();
    if (r && ev.clientX > r.left && ev.clientX < r.right && ev.clientY > r.top - 20 && ev.clientY < r.bottom + 40) {
      const which = S.sys; S.sysAdded = true; render();
      setTimeout(() => { S.perm[which] = true; S.sys = null; render(); if (which === "scr") toast("屏幕录制已允许，重新打开 Ask Free 后生效", "toast:已重新打开 Ask Free", "现在重开"); else toast("辅助功能已允许，快捷键能用了"); }, 900);
    } else if (l) l.classList.remove("hot");
  };
  document.addEventListener("mousemove", mv); document.addEventListener("mouseup", up);
});

  const user = hp("user"), scene = hp("scene");
  if (user === "ready") setReady(); else setNew();
  const p = scene || "start";
  if (p === "start" || p === "history") { S.page = p; }
  else openPage(p);

})();
