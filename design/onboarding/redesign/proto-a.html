<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1440"><title>Ask Free 欢迎引导 方向 A 侧栏步骤</title>
<style>:root{
  /* Ask Free 主色：图标的墨黑（BrandMark ink #141416）。主按钮、选中、开关打开、链接都用它；深色时反过来 */
  --bg:#FAFAFA;--surface:#F4F4F5;--elevated:#FFFFFF;--hover:rgba(0,0,0,.04);--selected:rgba(0,0,0,.07);
  --border:rgba(0,0,0,.09);--border2:rgba(0,0,0,.16);
  --text:#141416;--text2:#5E6068;--text3:#97999F;
  --ink:#141416;--on-ink:#FFFFFF;--ink-soft:rgba(20,20,22,.07);
  --ok:#2E8762;--ok-soft:rgba(46,135,98,.12);--warn:#C27A1A;--warn-soft:rgba(194,122,26,.12);--danger:#C24545;--danger-soft:rgba(194,69,69,.10);
  --mark:#E5484D;
  --desk:linear-gradient(160deg,#E3E4E8 0%,#D3D5DB 55%,#C8CAD1 100%);
  --menubar:rgba(246,246,247,.78);
  --win-shadow:0 0 0 .5px rgba(0,0,0,.18),0 22px 60px -10px rgba(20,20,30,.32),0 6px 16px rgba(20,20,30,.10);
  --pop-shadow:0 0 0 .5px rgba(0,0,0,.12),0 12px 32px -6px rgba(20,20,30,.26);
  --stage:#EFEFF1;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
:root[data-theme="dark"]{
  --bg:#1E1E1F;--surface:#232325;--elevated:#2A2A2C;--hover:rgba(255,255,255,.05);--selected:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.15);
  --text:#F5F5F7;--text2:#A1A1A8;--text3:#6E6E75;
  --ink:#F5F5F7;--on-ink:#1E1E1F;--ink-soft:rgba(255,255,255,.08);
  --ok:#4CC38A;--ok-soft:rgba(76,195,138,.15);--warn:#F0A548;--warn-soft:rgba(240,165,72,.15);--danger:#F07575;--danger-soft:rgba(240,117,117,.14);
  --mark:#FF6369;
  --desk:linear-gradient(160deg,#25262B 0%,#1B1C20 55%,#141518 100%);
  --menubar:rgba(32,32,35,.78);
  --win-shadow:0 0 0 .5px rgba(255,255,255,.12),0 22px 60px -10px rgba(0,0,0,.7),0 6px 16px rgba(0,0,0,.35);
  --pop-shadow:0 0 0 .5px rgba(255,255,255,.12),0 12px 32px -6px rgba(0,0,0,.6);
  --stage:#262628;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font:13px/1.5 var(--sans);color:var(--text);-webkit-font-smoothing:antialiased;text-autospace:normal;font-kerning:normal;background:var(--desk);user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:var(--text);user-select:text;-webkit-user-select:text}
svg{display:block}
.tab{font-variant-numeric:tabular-nums}
#desk{position:relative;width:1440px;height:887px;overflow:hidden;background:var(--desk)}

/* 菜单栏 */
.menubar{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;gap:4px;padding:0 10px;background:var(--menubar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:13px;z-index:70}
.menubar .sp{flex:1}
.menubar .mi{display:flex;align-items:center;height:22px;padding:0 8px;border-radius:5px;color:var(--text);white-space:nowrap}
.menubar .mi b{font-weight:600}
.menubar .sys{display:flex;align-items:center;gap:2px;color:var(--text)}
.menubar .sys svg{width:16px;height:16px}
.menubar .af{position:relative;cursor:pointer}
.menubar .af.on,.menubar .af:hover{background:var(--selected)}
.menubar .af svg{width:17px;height:17px}
.menubar .af .bdot{position:absolute;right:3px;bottom:3px;width:6px;height:6px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 1.5px var(--menubar)}
.menubar .af.pulse::after{content:"";position:absolute;inset:-2px;border-radius:7px;border:1.5px solid var(--ink);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{opacity:.9;transform:scale(.9)}100%{opacity:0;transform:scale(1.35)}}

/* 窗口 */
.win{position:absolute;background:var(--bg);border-radius:12px;box-shadow:var(--win-shadow);overflow:hidden;display:flex;flex-direction:column}
.tl{display:flex;gap:8px;align-items:center}
.tl i{width:12px;height:12px;border-radius:50%;background:#FF5F57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.tl i:nth-child(2){background:#FEBC2E}.tl i:nth-child(3){background:#28C840}
.tl.off i{background:var(--border2)}

/* 控件 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;flex:none;height:28px;padding:0 12px;border-radius:6px;border:1px solid var(--border2);background:var(--elevated);font-weight:500;font-size:13px}
.btn:hover{background:var(--surface)}
.btn.solid{background:var(--ink);color:var(--on-ink);border-color:transparent}
.btn.solid:hover{opacity:.88}
.btn[disabled]{opacity:.4;cursor:default;pointer-events:none}
.btn.ghost{border-color:transparent;background:none;color:var(--text2)}
.btn.ghost:hover{color:var(--text);background:var(--hover)}
.btn.sm{height:24px;padding:0 10px;font-size:12px}
.btn.lg{height:32px;padding:0 16px}
.link{color:var(--text);text-decoration:underline;text-decoration-color:var(--border2);text-underline-offset:3px;cursor:pointer}
.link:hover{text-decoration-color:var(--text)}
.field{height:30px;width:100%;padding:0 10px;border-radius:6px;border:1px solid var(--border2);background:var(--elevated);outline:none;font-size:13px}
.field:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--ink-soft)}
.field.mono{font-family:var(--mono);font-size:12px}
.field.mono::placeholder{font-family:var(--sans);font-size:13px;color:var(--text3)}
.muted{color:var(--text2)}.faint{color:var(--text3)}.small{font-size:12px}
.okc{color:var(--ok)}.warnc{color:var(--warn)}.badc{color:var(--danger)}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:5px;font-size:11px;font-weight:500;background:var(--selected);color:var(--text2);white-space:nowrap}
.chip.ink{background:var(--ink);color:var(--on-ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--text3)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--danger)}
.kbd{display:inline-flex;align-items:center;justify-content:center;gap:3px;min-width:20px;height:20px;padding:0 6px;border-radius:5px;border:1px solid var(--border2);border-bottom-width:2px;background:var(--elevated);font-size:11px;font-weight:500;color:var(--text);white-space:nowrap;vertical-align:middle}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--border2);border-top-color:var(--text);animation:sp .8s linear infinite;flex:none;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.ico{width:16px;height:16px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.ico svg{width:16px;height:16px}
/* 方角开关（偏好：方角开关） */
.sw{width:32px;height:19px;border-radius:5px;background:var(--border2);position:relative;flex:none;cursor:pointer;transition:background .18s}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:3px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .18s}
.sw.on{background:var(--ink)}
:root[data-theme="dark"] .sw.on::after{background:#1E1E1F}
.sw.on::after{transform:translateX(13px)}
.seg{display:inline-flex;padding:2px;border-radius:7px;background:var(--selected);gap:2px}
.seg button{height:24px;padding:0 10px;border-radius:5px;font-size:12px;color:var(--text2)}
.seg button.on{background:var(--elevated);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:500}
.group{border:1px solid var(--border);border-radius:8px;background:var(--elevated);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;border-top:1px solid var(--border)}
.row:first-child{border-top:0}
.row .lb{flex:1;min-width:0}
.row .lb b{display:block;font-weight:500}
.row .lb span{display:block;font-size:12px;color:var(--text2);line-height:1.45}
.state{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}
.state svg{width:14px;height:14px}

/* 系统设置（示意） */
.ss{z-index:40}
.ss .side{width:200px;background:var(--surface);border-right:1px solid var(--border);padding:14px 10px;flex:none}
.ss .side .it{display:flex;align-items:center;gap:8px;height:26px;padding:0 8px;border-radius:6px;font-size:12.5px;color:var(--text)}
.ss .side .it i{width:16px;height:16px;border-radius:4px;background:var(--border2);flex:none}
.ss .side .it.on{background:var(--selected);font-weight:500}
.ss .main{flex:1;padding:16px 22px;overflow:hidden}
.ss h3{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.ss .desc{font-size:12px;color:var(--text2);margin:6px 0 12px}
.ss .list{border:1px solid var(--border);border-radius:8px;background:var(--elevated);transition:box-shadow .15s,border-color .15s;position:relative}
.ss .list.over{border-color:var(--ink);box-shadow:0 0 0 3px var(--ink-soft)}
.ss .list .hint{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:var(--ink-soft);font-weight:500;border-radius:8px}
.ss .list.over .hint{display:flex}
.ss .lr{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-top:1px solid var(--border)}
.ss .lr:first-child{border-top:0}
.ss .lr .ap{width:22px;height:22px;border-radius:5px;flex:none}
.ss .lr .nm{flex:1}
.ss .lr.new{animation:rowin .35s ease-out}
@keyframes rowin{from{background:var(--ink-soft)}to{background:transparent}}
.ss .pm{display:flex;gap:0;margin-top:8px}
.ss .pm span{width:24px;height:22px;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:14px;background:var(--elevated)}
.ss .pm span+span{border-left:0}

/* 拖图标小面板：和 PermissionDragHelper 一样贴在系统设置右边 */
.helper{position:absolute;z-index:45;width:340px;height:92px;display:flex;align-items:center;gap:14px;padding:0 14px;border-radius:12px;background:var(--elevated);box-shadow:var(--pop-shadow)}
.helper .gr{width:52px;height:52px;border-radius:10px;border:1.2px dashed var(--ink);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:grab;flex:none;touch-action:none;transition:transform .15s}
.helper .gr:hover{transform:scale(1.05)}
.helper .gr.lift{opacity:.35}
.helper .tx{flex:1;min-width:0}
.helper .tx b{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600}
.helper .tx b .ar{display:inline-flex;animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(1px)}50%{transform:translateX(-3px)}}
.helper .tx span{display:block;font-size:12px;color:var(--text2);line-height:1.45;margin-top:2px}
.helper .x{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.helper .x:hover{background:var(--hover)}
.helper.done .gr{border-style:solid;border-color:var(--ok)}
.ghost-icon{position:absolute;z-index:90;width:48px;height:48px;pointer-events:none;filter:drop-shadow(0 6px 12px rgba(0,0,0,.25));transform:translate(-24px,-24px)}

/* 系统弹框 */
.alert{position:absolute;z-index:80;width:260px;padding:18px 16px 14px;border-radius:12px;background:var(--elevated);box-shadow:var(--pop-shadow);text-align:center}
.alert .ic{width:56px;height:56px;margin:0 auto 10px}
.alert b{display:block;font-size:13px;font-weight:600;line-height:1.4}
.alert p{font-size:11.5px;color:var(--text2);margin:6px 0 14px;line-height:1.45}
.alert .bt{display:flex;flex-direction:column;gap:6px}
.alert .bt button{height:28px;border-radius:6px;background:var(--selected);font-size:13px}
.alert .bt button.pri{background:#0A84FF;color:#fff}

/* 背后的 Safari 窗口：试问时被指着的内容 */
.safari{left:470px;top:110px;width:900px;height:640px;z-index:5}
.safari .bar{height:46px;flex:none;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.safari .url{flex:1;max-width:420px;margin:0 auto;height:28px;border-radius:7px;background:var(--selected);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text2)}
.safari .pg{padding:30px 48px;overflow:hidden}
.safari h2{font-size:22px;font-weight:600;line-height:1.35}
.safari .meta{font-size:12px;color:var(--text3);margin:6px 0 18px}
.chart{border:1px solid var(--border);border-radius:8px;padding:14px 18px 10px;background:var(--elevated)}
.chart .ct{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:8px}
.chart .bars{display:flex;align-items:flex-end;gap:28px;height:150px;padding:0 10px;border-bottom:1px solid var(--border2)}
.chart .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.chart .b i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--text3)}
.chart .b.hi i{background:var(--ink)}
.chart .b em{font-style:normal;font-size:11px;color:var(--text2)}
.chart .xs{display:flex;gap:28px;padding:5px 10px 0}
.chart .xs span{flex:1;text-align:center;font-size:11px;color:var(--text3)}
.safari p.para{margin-top:18px;font-size:14px;line-height:1.75;color:var(--text);max-width:68ch}

/* 录音胶囊 */
.capsule{position:absolute;z-index:85;left:50%;bottom:64px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;height:40px;padding:0 16px 0 12px;border-radius:20px;background:rgba(20,20,22,.92);color:#fff;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.3);white-space:nowrap}
.capsule .wave{display:flex;align-items:center;gap:2px;height:18px}
.capsule .wave i{width:3px;border-radius:2px;background:#fff;animation:wv .9s ease-in-out infinite}
.capsule .wave i:nth-child(2){animation-delay:.15s}.capsule .wave i:nth-child(3){animation-delay:.3s}.capsule .wave i:nth-child(4){animation-delay:.45s}.capsule .wave i:nth-child(5){animation-delay:.6s}
@keyframes wv{0%,100%{height:4px}50%{height:16px}}
.capsule .hint{color:rgba(255,255,255,.55);font-size:12px}

/* 回答面板（样子以提问浮层方案为准，这里只画到能看懂流程） */
.answer{position:absolute;z-index:84;right:16px;top:36px;width:380px;border-radius:12px;background:var(--elevated);box-shadow:var(--pop-shadow);padding:14px 16px 12px;animation:fin .2s ease-out}
@keyframes fin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.answer .hd{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)}
.answer .hd .x{margin-left:auto;width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center}
.answer .hd .x:hover{background:var(--hover)}
.answer .q{margin-top:10px;font-weight:500}
.answer .shot{margin-top:8px;width:132px;height:74px;border-radius:6px;background:var(--stage);position:relative;overflow:hidden;border:1px solid var(--border)}
.answer .shot .mb{position:absolute;bottom:10px;width:14px;background:var(--text3);border-radius:2px 2px 0 0}
.answer .shot .fr{position:absolute;border:1.5px solid var(--mark);border-radius:2px}
.answer .a{margin-top:10px;font-size:13px;line-height:1.65;min-height:44px}
.answer .ft{margin-top:10px;padding-top:8px;border-top:1px solid var(--border);font-size:12px;color:var(--text3);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}

/* 菜单栏菜单（系统菜单的样子） */
.menu{position:absolute;z-index:75;width:280px;padding:5px;border-radius:9px;background:var(--elevated);box-shadow:var(--pop-shadow);font-size:13px}
.menu .it{display:flex;align-items:center;gap:8px;height:24px;padding:0 9px;border-radius:5px;cursor:default;white-space:nowrap;position:relative}
.menu .it.act:hover,.menu .it.open{background:#0A84FF;color:#fff}
.menu .it.act:hover .faint,.menu .it.act:hover .muted,.menu .it.open .faint{color:rgba(255,255,255,.8)}
.menu .it.act:hover .dot{box-shadow:0 0 0 1.5px #fff}
.menu .it .sp{flex:1}
.menu .it .ck{width:12px;text-align:center;flex:none}
.menu .it.dis{color:var(--text3)}
.menu .it.st{height:auto;padding:5px 9px 6px;align-items:flex-start;flex-direction:column;gap:1px;white-space:normal}
.menu .it.st b{font-weight:500;display:flex;align-items:center;gap:7px}
.menu .it.st small{font-size:12px;color:var(--text2);padding-left:14px}
.menu .sep{height:1px;background:var(--border);margin:5px 9px}
.menu .key{color:var(--text3);font-size:12px}
.menu .sub{position:absolute;right:100%;top:-5px;margin-right:4px;width:300px;color:var(--text)}

/* 提示气泡 */
.tip{position:absolute;z-index:76;width:280px;padding:12px 14px;border-radius:10px;background:var(--ink);color:var(--on-ink);font-size:12.5px;line-height:1.5;box-shadow:var(--pop-shadow)}
.tip::before{content:"";position:absolute;top:-6px;right:var(--ar,20px);width:12px;height:12px;background:var(--ink);transform:rotate(45deg);border-radius:2px}
.tip b{font-weight:600;display:block;margin-bottom:2px}
.tip .bt{display:flex;justify-content:flex-end;margin-top:8px}
.tip .bt button{height:24px;padding:0 10px;border-radius:5px;background:rgba(127,127,127,.25);font-size:12px;color:inherit}

.toast{position:absolute;z-index:95;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(20,20,22,.92);color:#fff;font-size:12px;padding:7px 12px;border-radius:7px;white-space:nowrap;animation:fin .2s ease-out}
/* 原型控制条：只在原型里 */
.proto{position:absolute;left:12px;bottom:12px;z-index:96;display:flex;gap:4px;align-items:center;padding:4px;border-radius:8px;background:rgba(20,20,22,.82);color:#fff;font-size:11.5px}
.proto span{padding:0 6px;color:rgba(255,255,255,.55)}
.proto button{height:22px;padding:0 8px;border-radius:5px;color:#fff}
.proto button:hover{background:rgba(255,255,255,.14)}
.fade{animation:fin .18s ease-out}

/* 方向 A：侧栏步骤（和 GetNewWord 欢迎页同一副骨架） */
.oa{left:110px;top:88px;width:900px;height:640px;z-index:20;flex-direction:row}
.oa .side{width:236px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px 14px}
.oa .brand{display:flex;align-items:center;gap:10px;margin:22px 6px 22px}
.oa .brand b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.oa .brand small{display:block;font-size:12px;color:var(--text2)}
.oa .st{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-align:left;width:100%}
.oa .st:hover{background:var(--hover)}
.oa .st.on{background:var(--elevated);box-shadow:0 0 0 1px var(--border)}
.oa .st .o{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text2);flex:none}
.oa .st.on .o{border-color:var(--ink);color:var(--text);font-weight:600}
.oa .st .o.ok{border:0;color:var(--ok)}
.oa .st .o.ok svg{width:22px;height:22px}
.oa .st b{display:block;font-weight:500;line-height:1.35}
.oa .st small{display:block;font-size:12px;color:var(--text2);line-height:1.35}
.oa .side .sp{flex:1}
.oa .skip{font-size:12px;color:var(--text2);padding:0 10px;text-align:left}
.oa .skip:hover{color:var(--text)}
.oa .body{flex:1;display:flex;flex-direction:column;min-width:0}
.oa .scroll{flex:1;overflow:auto;padding:40px 44px 20px}
.oa h1{font-size:22px;font-weight:600;line-height:1.35}
.oa .sub{color:var(--text2);margin-top:6px;max-width:56ch}
.oa .foot{height:60px;flex:none;display:flex;align-items:center;gap:8px;padding:0 20px 0 44px;border-top:1px solid var(--border)}
.oa .foot .msg{flex:1;font-size:12px;color:var(--text2)}
