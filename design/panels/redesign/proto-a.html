<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1280"><title>Ask Free 提问浮层 方向 A 右上对话卡</title>
<style>:root{
  /* 和 GetNewWord Theme.swift 同一套骨架；主色是 Ask Free 图标里指针的墨黑（和主窗口方案 DESIGN.draft.md 对齐），不用蓝 */
  --bg:#FAFAFB;--surface:#F4F4F6;--elevated:#FFFFFF;--hover:rgba(0,0,0,.045);--selected:rgba(0,0,0,.07);
  --border:rgba(0,0,0,.09);--border2:rgba(0,0,0,.16);
  --text:#18191C;--text2:#5F636C;--text3:#969AA2;
  --accent:#18191C;--accent-soft:rgba(0,0,0,.07);--accent-line:rgba(0,0,0,.35);
  --ok:#28965A;--ok-soft:rgba(40,150,90,.12);--warn:#CD7D14;--warn-soft:rgba(205,125,20,.12);--danger:#C83C3C;--danger-soft:rgba(200,60,60,.10);
  --solid:#18191C;--on-solid:#FFFFFF;
  --panel:rgba(250,250,251,.94);
  --panel-shadow:0 0 0 .5px rgba(0,0,0,.18),0 18px 48px -8px rgba(15,18,30,.38),0 4px 12px rgba(15,18,30,.10);
  --hud:#121214;--hud-edge:rgba(255,255,255,.14);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
:root[data-theme="dark"]{
  --bg:#16171A;--surface:#1C1D20;--elevated:#232428;--hover:rgba(255,255,255,.06);--selected:rgba(255,255,255,.09);
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.15);
  --text:#EDEDEF;--text2:#9A9FA8;--text3:#6E7480;
  --accent:#EDEDEF;--accent-soft:rgba(255,255,255,.10);--accent-line:rgba(255,255,255,.4);
  --ok:#5CC285;--ok-soft:rgba(92,194,133,.15);--warn:#F29E40;--warn-soft:rgba(242,158,64,.15);--danger:#E65C5C;--danger-soft:rgba(230,92,92,.14);
  --solid:#EDEDEF;--on-solid:#16171A;
  --panel:rgba(30,31,35,.95);
  --panel-shadow:0 0 0 .5px rgba(255,255,255,.14),0 18px 48px -8px rgba(0,0,0,.75),0 4px 12px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:800px;overflow:hidden;background:#0d0e10}
body{font:13px/1.5 var(--sans);color:var(--text);-webkit-font-smoothing:antialiased;text-autospace:normal;font-kerning:normal}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
svg{display:block}
#stage{position:relative;width:1280px;height:744px;overflow:hidden;user-select:none;background:#1b1c1f}
#bg{position:absolute;left:0;right:0;top:24px;bottom:0}
#layer{position:absolute;inset:0;pointer-events:none}
#layer>*{pointer-events:auto}
#layer .pass{pointer-events:none}

/* 菜单栏（示意） */
#menubar{position:absolute;left:0;right:0;top:0;height:24px;background:rgba(236,236,238,.92);backdrop-filter:blur(20px);display:flex;align-items:center;gap:18px;padding:0 14px;font-size:13px;color:#1d1d1f;z-index:3}
#menubar b{font-weight:600}
#menubar .r{margin-left:auto;display:flex;gap:14px;align-items:center}
#menubar .me{display:flex;align-items:center;justify-content:center;width:22px;height:18px;border-radius:4px}
#menubar .me.on{background:rgba(0,0,0,.12)}

/* 共用控件 */
.ibtn{width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--text2);flex:none;transition:background .15s,color .15s}
.ibtn:hover{background:var(--hover);color:var(--text)}
.ibtn.on{color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;flex:none;height:28px;padding:0 12px;border-radius:6px;border:1px solid var(--border2);background:var(--elevated);font-weight:500;font-size:13px;color:var(--text)}
.btn:hover{background:var(--surface)}
.btn.solid{background:var(--solid);color:var(--on-solid);border-color:transparent}
.btn.solid:hover{opacity:.86}
.btn.ghost{border-color:transparent;background:none;color:var(--text2)}
.btn.ghost:hover{background:var(--hover);color:var(--text)}
.kc{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;border-radius:5px;border:1px solid var(--border2);border-bottom-width:1.5px;background:var(--elevated);font-size:11px;font-weight:500;color:var(--text);vertical-align:-3px;margin:0 2px;line-height:1}
.muted{color:var(--text2)}.faint{color:var(--text3)}
.spin{width:12px;height:12px;border-radius:50%;border:1.6px solid var(--border2);border-top-color:var(--text2);animation:spin .8s linear infinite;flex:none;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.caret{display:inline-block;width:2px;height:1.05em;vertical-align:-2px;margin-left:1px;background:var(--accent);animation:blink .9s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.fadein{animation:fi .24s ease-out both}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--text3);animation:dot 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{40%{background:var(--text);transform:translateY(-2px)}}

/* 回答正文（两个方向共用） */
.md{font-size:14px;line-height:1.65;color:var(--text)}
.md p{margin:0 0 8px}
.md p:last-child,.md ul:last-child{margin-bottom:0}
.md ul{margin:0 0 8px;padding:0;list-style:none}
.md li{position:relative;padding-left:14px;margin:2px 0}
.md li::before{content:"";position:absolute;left:3px;top:.72em;width:4px;height:4px;border-radius:50%;background:var(--text3)}
.md b{font-weight:600}

/* 报错块（两个方向共用） */
.err{display:flex;gap:12px;align-items:flex-start}
.err .eico{position:relative;width:36px;height:36px;border-radius:8px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text);flex:none}
.err .eico i{position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border-radius:50%;background:var(--warn);color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--elevated)}
.err .eico i.red{background:var(--danger)}
.err h4{font-size:14px;font-weight:600;line-height:1.4;margin-top:1px}
.err p{font-size:13px;color:var(--text2);margin-top:3px;line-height:1.55}
.err .acts{display:flex;gap:8px;margin-top:12px}
.warnbar{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 10px;border-radius:8px;background:var(--warn-soft);font-size:12px;color:var(--text);line-height:1.45}
.warnbar svg{color:var(--warn);flex:none}
.warnbar span{flex:1}
.warnbar .btn{height:24px;padding:0 9px;font-size:12px}
.okbar{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;background:var(--ok-soft);font-size:12px;line-height:1.45}
.okbar svg{color:var(--ok);flex:none}
.okbar span{flex:1}
.okbar .btn{height:24px;padding:0 9px;font-size:12px}

/* 找到的图 */
.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.imgs .im{height:84px;border-radius:6px;overflow:hidden;position:relative;border:1px solid var(--border)}
.imgs .im span{position:absolute;left:6px;bottom:5px;font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.src{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);margin-bottom:6px}
.src svg{color:var(--text3)}

/* 设置窗示意（去填 Key） */
.sheet-mask{position:absolute;inset:0;background:rgba(0,0,0,.18)}
.keywin{position:absolute;left:330px;top:150px;width:520px;border-radius:12px;background:var(--bg);box-shadow:var(--panel-shadow);overflow:hidden;color:var(--text)}
.keywin .tb{height:36px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--border);font-size:13px;font-weight:500;background:var(--surface)}
.keywin .tb .tl{display:flex;gap:7px;margin-right:8px}.keywin .tb .tl i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.keywin .tb .tl i:nth-child(2){background:#febc2e}.keywin .tb .tl i:nth-child(3){background:#28c840}
.keywin .bd{padding:18px 20px 20px}
.keywin .row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--elevated);margin-bottom:8px}
.keywin .row.sel{border-color:var(--accent-line)}
.keywin .row .nm{font-weight:500;width:84px}
.keywin .row .ds{color:var(--text2);font-size:12px;flex:1}
.keywin .field{display:flex;gap:8px;margin:4px 0 0}
.keywin .inp{flex:1;height:30px;border-radius:6px;border:1px solid var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--elevated);display:flex;align-items:center;padding:0 10px;font-family:var(--mono);font-size:12px;color:var(--text)}
.keywin .foot{display:flex;align-items:center;gap:8px;margin-top:14px}
.keywin .foot .sp{flex:1}

/* 拖图标授权示意 */
.sysset{position:absolute;left:250px;top:110px;width:560px;height:430px;border-radius:12px;background:#f5f5f7;box-shadow:0 0 0 .5px rgba(0,0,0,.2),0 22px 60px rgba(0,0,0,.35);overflow:hidden;color:#1d1d1f;font-size:13px}
.sysset .side{position:absolute;left:0;top:0;bottom:0;width:170px;background:#e8e8ea;padding:44px 10px 0}
.sysset .side div{height:28px;border-radius:6px;display:flex;align-items:center;padding:0 8px;color:#333}
.sysset .side div.on{background:#0a64d6;color:#fff}
.sysset .main{position:absolute;left:170px;right:0;top:0;bottom:0;padding:16px 22px}
.sysset h3{font-size:15px;font-weight:600;margin:4px 0 4px}
.sysset .desc{color:#6e6e73;font-size:12px;margin-bottom:12px}
.sysset .list{border-radius:8px;background:#fff;border:1px solid rgba(0,0,0,.08);min-height:120px;transition:box-shadow .15s}
.sysset .list.hot{box-shadow:0 0 0 2px #0a64d6}
.sysset .li{height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid rgba(0,0,0,.06)}
.sysset .li:last-child{border-bottom:0}
.sysset .li .ap{width:22px;height:22px;border-radius:5px;background:#ddd}
.sysset .li .sw{margin-left:auto;width:32px;height:18px;border-radius:5px;background:#d6d6d9;position:relative;transition:background .2s}
.sysset .li .sw::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:3px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .2s}
.sysset .li .sw.on{background:#28a745}.sysset .li .sw.on::after{left:16px}
.dragpad{position:absolute;left:826px;top:200px;width:180px;padding:14px;border-radius:12px;background:var(--elevated);box-shadow:var(--panel-shadow);text-align:center;color:var(--text)}
.dragpad .ic{width:64px;height:64px;margin:4px auto 8px;border-radius:14px;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.15),0 2px 6px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;cursor:grab}
.dragpad p{font-size:12px;color:var(--text2);line-height:1.5}
.dragpad .arrow{color:var(--text);font-size:12px;margin-top:6px;font-weight:500}
.ghosticon{position:absolute;width:64px;height:64px;border-radius:14px;background:#fff;box-shadow:0 8px 20px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:50}

/* 控制条（原型用，不是界面的一部分） */
#bar{position:absolute;left:0;right:0;bottom:0;height:56px;background:#0d0e10;display:flex;align-items:center;gap:6px;padding:0 12px;color:#c9cbd1;font-size:12px;border-top:1px solid #222}
#bar .lab{color:#6d717a;margin:0 4px 0 8px;white-space:nowrap}
#bar .cb{height:30px;padding:0 10px;border-radius:6px;background:#1d1f24;color:#e6e7ea;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
#bar .cb:hover{background:#2a2d33}
#bar .cb.on{background:#e6e7ea;color:#111}
#bar .cb.main{background:#e6e7ea;color:#111;font-weight:600}
#bar .cb.main:hover{background:#fff}
#bar .cb.main.rec{background:#c83c3c}
#bar .sep{width:1px;height:24px;background:#2a2d33;margin:0 4px}
#errmenu{position:absolute;bottom:60px;background:#1d1f24;border:1px solid #2f3238;border-radius:10px;padding:6px;display:none;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#errmenu.show{display:block}
#errmenu button{display:block;width:100%;text-align:left;height:30px;padding:0 10px;border-radius:6px;color:#e6e7ea;font-size:12px;white-space:nowrap}
#errmenu button:hover{background:#2a2d33}

/* ===== 背景：网页 ===== */
.bg-web{position:absolute;inset:0;background:#fff;color:#202122}
.bg-web .chrome{height:44px;background:#ececee;border-bottom:1px solid #d6d6da;display:flex;align-items:center;padding:0 14px;gap:12px}
.bg-web .tl{display:flex;gap:8px}.bg-web .tl i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.bg-web .tl i:nth-child(2){background:#febc2e}.bg-web .tl i:nth-child(3){background:#28c840}
.bg-web .url{width:520px;margin:0 auto;height:28px;border-radius:7px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;color:#555}
.bg-web .wrap{display:flex;gap:36px;width:1060px;margin:26px auto 0}
.bg-web .art{flex:1;font-family:Georgia,"Songti SC",serif}
.bg-web .crumb{font:12px var(--sans);color:#72777d;margin-bottom:4px}
.bg-web h1{font:400 30px/1.25 Georgia,"Songti SC",serif;border-bottom:1px solid #a2a9b1;padding-bottom:6px;margin-bottom:14px}
.bg-web p{font-size:16px;line-height:1.75;margin-bottom:14px;color:#202122}
.bg-web .lk{color:#3366cc}
.bg-web .info{width:300px;flex:none;border:1px solid #a2a9b1;background:#f8f9fa;padding:8px;font:12px/1.5 var(--sans)}
.bg-web .info .pic{height:300px;background:linear-gradient(#bcd3ee,#e8eef6 70%,#c9cfb8 70%);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.bg-web .info table{width:100%;margin-top:8px;border-collapse:collapse}
.bg-web .info td{padding:3px 4px;border-top:1px solid #e3e5e8;vertical-align:top}
.bg-web .info td:first-child{font-weight:600;width:80px}
/* ===== 背景：视频 ===== */
.bg-video{position:absolute;inset:0;background:#000}
.bg-video .slide{position:absolute;left:0;right:0;top:0;bottom:64px;background:#f6f4ef;color:#222}
.bg-video .slide h2{position:absolute;left:70px;top:44px;font:600 30px var(--sans)}
.bg-video .slide .formula{position:absolute;left:70px;top:104px;font:italic 26px "Times New Roman",serif;color:#333}
.bg-video .slide .lbl{position:absolute;font:500 15px var(--sans);color:#666}
.bg-video .teacher{position:absolute;right:30px;bottom:84px;width:200px;height:150px;border-radius:8px;background:linear-gradient(160deg,#4a5161,#262a33);overflow:hidden;border:2px solid #fff}
.bg-video .teacher i{position:absolute;left:66px;top:28px;width:68px;height:68px;border-radius:50%;background:#c9a98c}
.bg-video .teacher b{position:absolute;left:40px;top:96px;width:120px;height:80px;border-radius:50% 50% 0 0;background:#30343e}
.bg-video .sub{position:absolute;left:0;right:0;bottom:92px;text-align:center;font:500 22px var(--sans);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.bg-video .sub span{background:rgba(0,0,0,.62);padding:3px 10px;border-radius:4px}
.bg-video .ctl{position:absolute;left:0;right:0;bottom:0;height:64px;background:#111;display:flex;align-items:center;gap:14px;padding:0 20px;color:#fff;font-size:13px}
.bg-video .prog{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.22);position:relative}
.bg-video .prog i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:#e33;width:37%}
.bg-video .pp{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;color:#fff;opacity:0;transition:opacity .2s}
.bg-video .pp.show{opacity:1}
.bg-video .spacehint{position:absolute;left:20px;top:16px;font:12px var(--sans);color:#fff;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:6px;opacity:0;transition:opacity .2s}
.bg-video .spacehint.show{opacity:1}
/* ===== 背景：PDF ===== */
.bg-pdf{position:absolute;inset:0;background:#8e9096}
.bg-pdf .tb{height:44px;background:#e9e9eb;border-bottom:1px solid #cfcfd3;display:flex;align-items:center;padding:0 14px;gap:12px;font:13px var(--sans);color:#333}
.bg-pdf .tl{display:flex;gap:8px}.bg-pdf .tl i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.bg-pdf .tl i:nth-child(2){background:#febc2e}.bg-pdf .tl i:nth-child(3){background:#28c840}
.bg-pdf .page{position:absolute;left:250px;top:62px;width:780px;bottom:-40px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.3);padding:46px 64px;font-family:"Times New Roman",Georgia,serif;color:#111}
.bg-pdf h1{font-size:24px;text-align:center;margin-bottom:6px}
.bg-pdf .au{text-align:center;font-size:13px;color:#444;margin-bottom:18px}
.bg-pdf .abs{font-size:14px;line-height:1.6;text-align:justify;margin-bottom:16px}
.bg-pdf .abs b{font-weight:700}
.bg-pdf .fig{border-top:1px solid #ddd;padding-top:12px}
.bg-pdf .cap{font-size:13px;line-height:1.5;margin-top:6px}
.fakecur{position:absolute;width:20px;height:24px;pointer-events:none;z-index:30;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.4));transition:left .35s ease,top .35s ease}
/* ===== 方向 A：右上对话卡 ===== */
.card{position:absolute;right:12px;top:34px;width:400px;max-height:640px;display:flex;flex-direction:column;border-radius:12px;background:var(--panel);backdrop-filter:blur(30px) saturate(1.4);-webkit-backdrop-filter:blur(30px) saturate(1.4);box-shadow:var(--panel-shadow);color:var(--text);overflow:hidden;transition:box-shadow .15s,opacity .3s,transform .22s;transform-origin:top right}
.card.enter{animation:cin .22s ease-out both}
@keyframes cin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.card.listen{box-shadow:0 0 0 1.5px var(--accent),var(--panel-shadow)}
.card .hd{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;border-bottom:1px solid var(--border);background:var(--surface)}
.card .hd .lg{color:var(--text);--logo-in:var(--surface);display:flex}
.card .hd .st{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden}
.card .hd .st b{font-weight:500;color:var(--text)}
.card .hd .tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;background:var(--selected);color:var(--text);font-size:12px;font-weight:500}
.card .bd{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 6px;scrollbar-width:thin}
.card .ft{flex:none;height:44px;display:flex;align-items:center;gap:4px;padding:0 8px 0 10px;border-top:1px solid var(--border)}
.fbtn{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 8px;border-radius:6px;color:var(--text2);font-size:12px;white-space:nowrap}
.fbtn:hover{background:var(--hover);color:var(--text)}
.fbtn.hold{background:var(--selected);color:var(--text)}
.fbtn .kc{margin:0}
.card .ft .tip{margin-left:auto;font-size:12px;color:var(--text3);white-space:nowrap}
.card .ft .wv{flex:1;display:flex;align-items:center;justify-content:center;gap:3px;height:28px}
.card .ft .wv i{width:3px;border-radius:2px;background:var(--accent);height:4px;transition:height .08s}
/* 一轮问答 */
.thread{position:relative}
.turn{position:relative;padding-bottom:14px}
.thread.multi .turn{padding-left:30px}
.thread.multi .turn::before{content:"";position:absolute;left:9px;top:22px;bottom:-2px;width:1.5px;background:var(--border2)}
.thread.multi .turn:last-child::before{display:none}
.turn .node{display:none;position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border2);background:var(--elevated);font-size:11px;font-weight:600;color:var(--text2);align-items:center;justify-content:center;font-variant-numeric:tabular-nums}

const BGS = {

    app: "Safari",
    html: `<div class="bg-web"><div class="chrome"><div class="tl"><i></i><i></i><i></i></div><div class="url">zh.wikipedia.org/wiki/1889年巴黎世界博览会</div></div>
      <div class="wrap"><div class="art"><div class="crumb">维基百科，自由的百科全书</div><h1>1889年巴黎世界博览会</h1>
      <p>1889年巴黎世界博览会于 5 月 6 日至 10 月 31 日在法国巴黎举行，用来纪念<span class="lk">法国大革命</span>爆发一百周年。博览会吸引了超过三千二百万人次参观，是当时规模最大的一届。</p>

    q: [
      { q: "这座塔是什么时候建的", saw: true, a: "这是**埃菲尔铁塔**，1887 年 1 月动工，**1889 年 3 月 31 日**建成，正好赶上页面里说的 1889 年巴黎世界博览会开幕。\n\n- 设计和承建：古斯塔夫·埃菲尔的公司\n- 用了约 18,000 个铁构件、250 万颗铆钉\n- 原本只打算留 20 年，后来因为能当无线电塔才保留下来" },

// ===== 轻量 Markdown：空行分段、「- 」条目、**加粗** =====
function md(s) {
  const out = []; let list = null;
  for (const raw of s.split("\n")) {
    const line = raw.trimEnd();
    const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*\*([^*]*)$/, "<b>$1</b>");
    if (line.startsWith("- ")) { if (!list) { list = []; } list.push(`<li>${inl(line.slice(2))}</li>`); continue; }
    if (list) { out.push(`<ul>${list.join("")}</ul>`); list = null; }
    if (line) out.push(`<p>${inl(line)}</p>`);
  }
  if (list) out.push(`<ul>${list.join("")}</ul>`);
  return out.join("");
}
// 逐字流出：每 60ms 吐 6 到 10 个字
async function stream(el, text, token, onTick) {
  let n = 0;
  while (n < text.length) {
    if (token.dead) return false;
    n = Math.min(text.length, n + 6 + Math.floor(Math.random() * 5));
    el.innerHTML = md(text.slice(0, n));
    const last = el.lastElementChild && (el.lastElementChild.tagName === "UL" ? el.lastElementChild.lastElementChild : el.lastElementChild);
    if (last && n < text.length) last.insertAdjacentHTML("beforeend", '<span class="caret"></span>');
    onTick && onTick();
    await sleep(60);
  }
  return true;
}

  const t = $("[data-f=talk]", f);
  // 按下后底栏换成音浪，按钮不在了：松手在哪都算（真机也是本 App 收到左键松开就结束）
  t.addEventListener("pointerdown", e => { e.preventDefault(); t.classList.add("hold"); A.talkDown("panel"); addEventListener("pointerup", () => A.talkUp("panel"), { once: true }); });
  $("[data-f=type]", f).onclick = () => A.type();
}
function paintHead() {
  if (!A.card) return;
  const pin = $("[data-h=pin]", A.card); pin.innerHTML = A.pinned ? ICON.pinOn(15) : ICON.pin(15); pin.classList.toggle("on", A.pinned);
  const strip = A.card.classList.contains("strip");
  const last = A.turns[A.turns.length - 1];
  $(".st", A.card).innerHTML = strip && last ? `<b style="overflow:hidden;text-overflow:ellipsis">${esc(last.q)}</b>` : A.statusText;
}
function setStatus(html) { A.statusText = html; paintHead(); }
function turnHTML(t, i, n) {
  const cur = i === n - 1;
  return `<div class="turn ${cur ? "cur" : "old"}" data-i="${i}"><div class="node">${i + 1}</div>
    <div class="qrow"><div class="q">${i > 0 ? '<span class="qlab">追问</span>' : ""}${esc(t.q)}</div>${t.saw ? `<div class="thumb" title="发给 AI 的画面，点开看">${miniShot(58, 34, t.spot)}</div>` : ""}</div>
    ${t.saw ? `<div class="seen"><div><div class="pic" style="width:176px;height:104px">${miniShot(176, 104, t.spot, true)}</div><div class="cap">指着的地方</div></div><div><div class="pic" style="width:176px;height:104px">${miniShot(176, 104, t.spot)}</div><div class="cap">整个屏幕</div></div></div>` : ""}
    <div class="ans"></div></div>`;
}
function paintBody() {
  const bd = $(".bd", A.card); const n = A.turns.length;
  let h = "";
  if (A.old.length) {
    const o = A.old[A.old.length - 1];
    h += `<div class="stub" data-part="上个话题">${ICON.history(14)}<span>上个话题：${esc(o[0].q)} · ${o.length} 问</span><span style="margin-left:auto;flex:none">${A.showOld ? ICON.up(14) : ICON.chev(14)}</span></div>`;
    if (A.showOld) h += `<div class="oldtopic">${o.map((t, i) => `<div class="turn old"><div class="qrow"><div class="q">${esc(t.q)}</div></div><div class="ans"><div class="md">${md(t.a)}</div></div></div>`).join("")}</div>`;
    h += `<div class="divider">新话题</div>`;
  }
  h += `<div class="thread ${n > 1 ? "multi" : ""}" data-part="对话">${A.turns.map((t, i) => turnHTML(t, i, n)).join("")}</div>`;
  bd.innerHTML = h;
  A.turns.forEach((t, i) => { const el = $(`.turn[data-i="${i}"] .ans`, bd); t.el = el; fillAns(t); });
  $$(".thumb", bd).forEach(th => th.onclick = () => th.closest(".turn").querySelector(".seen").classList.toggle("show"));
  $$(".turn.old .ans", bd).forEach(a => a.onclick = () => a.closest(".turn").classList.remove("old"));
  const stub = $(".stub", bd); if (stub) stub.onclick = () => { A.showOld = !A.showOld; paintBody(); };
}
function fillAns(t) {
  if (!t.el) return;
  if (t.state === "think") t.el.innerHTML = `<div class="think"><span class="dots"><i></i><i></i><i></i></span>${t.saw ? "看着你指的地方，在想" : "在想"}</div>`;
  else if (t.state === "search") t.el.innerHTML = `<div class="think">${ICON.globe(14)}正在联网查<span class="dots"><i></i><i></i><i></i></span></div>`;
  else if (t.state === "err") t.el.innerHTML = errHTML(t.err);
  else t.el.innerHTML = `${t.warn ? t.warn : ""}${t.search ? srcHTML(t.search) : ""}<div class="md">${t.state === "done" ? md(t.a) : ""}</div>${t.state === "done" && t.imgs ? imgsHTML(t.imgs) : ""}`;
  $$("[data-act]", t.el).forEach(b => b.onclick = () => A.act(b.dataset.act, t));
}
function scrollEnd() { const bd = A.card && $(".bd", A.card); if (bd && A.turns.length > 1) bd.scrollTop = bd.scrollHeight; }

// ===== 说话 =====
A.talkDown = function (src) {
  if (A.rec) { if (A.rec.latched) A.rec.finish(); return; }
  if (A.err === "mic") return;
  const follow = A.canFollow();
  let done; const p = new Promise(r => done = r);
  A.rec = { follow, start: Date.now(), latched: false, finish: () => { if (A.rec) { const r = A.rec; A.rec = null; clearTimeout(r.auto); done(true); } } };
  if (follow) { A.state = "listen"; A.card.classList.add("listen"); A.card.classList.remove("strip", "fade"); setStatus(`<b>正在听</b> · 追问第 ${A.turns.length + 1} 问`); paintFoot(); }
  else showCap("rec");
  A.recP = p;
  p.then(() => A.afterRec(follow));
};
A.talkUp = function () {
  const r = A.rec; if (!r || r.latched) return;
  if (Date.now() - r.start < 320) { r.latched = true; r.auto = setTimeout(() => r.finish(), 1800); } // 轻点一下：开始录，再点或点对勾结束（原型里 1.8 秒后自己结束）
  else r.finish();
};
A.cancelRec = function () {
  if (!A.rec) return; const r = A.rec; A.rec = null; clearTimeout(r.auto);
  if (r.follow) { A.state = "idle"; A.card.classList.remove("listen"); setStatus(`<b>已取消</b>`); paintFoot(); setTimeout(() => A.doneStatus(), 1400); }
  else { showCap("hint", "已取消"); setTimeout(hideCap, 1200); }
};
A.afterRec = async function (follow) {
  const tok = A.run;
  if (follow) { A.state = "proc"; A.card.classList.remove("listen"); setStatus("识别中"); paintFoot(); }
  else showCap("proc");
  await sleep(A.nextFast ? 150 : 650); if (tok.dead) return;
  const perr = A.pendingErr; A.pendingErr = null;
  if (perr === "asr") { hideCap(); const c = ensureCard(); A.turns = [{ q: "", state: "err", err: "asr" }]; setStatus(`<b>没听懂</b> · 语音没转成文字`); paintFoot();
    $(".bd", c).innerHTML = `<div class="turn cur"><div class="ans"></div></div>`; A.turns[0].el = $(".ans", c); fillAns(A.turns[0]); return; }
  if (perr === "nospeech") { A.pendingErr = null; if (follow) { A.state = "idle"; paintFoot(); setStatus("<b>没听到问题</b> · 再按一次说"); setTimeout(() => A.doneStatus(), 1800); } else { showCap("hint", "没听到问题"); setTimeout(hideCap, 1600); } return; }
  if (!follow) hideCap();
  A.state = "idle";
  A.ask({ follow, recorded: true, newTopic: A.nextNew, fast: A.nextFast, err: perr });
  A.nextNew = false; A.nextFast = false;
};
A.canFollow = () => !!(A.card && A.turns.length && A.turns[A.turns.length - 1].state === "done" && !A.card.classList.contains("fade"));
A.doneStatus = function () {
  const last = A.turns[A.turns.length - 1]; if (!last) return;
  if (last.state === "err") return setStatus(`<b>没答成</b>`);
  const n = A.turns.length;
  setStatus(`<b>已答</b>${n > 1 ? ` · 第 ${n} 问` : ""} · ${last.search ? "千问 · 联网" : "DeepSeek"}${A.old.length && n === 1 ? ' <span class="tag">新话题</span>' : ""}`);
};

// ===== 问一句（录音之后，或打字之后） =====
A.ask = async function (o = {}) {
  if (o.auto || (!o.recorded && !o.typed)) {
    // 原型：自动演示一次录音
    if (o.newTopic) A.nextNew = true;
    A.nextFast = !!o.fast;
    const g = A.gen; A.talkDown("auto"); await sleep(o.fast ? 300 : 1500); if (g !== A.gen) return; A.rec && A.rec.finish();
    return new Promise(r => { A.onDone = r; });
  }
  const bg = BGS[S.bg];
  const follow = !o.newTopic && (o.follow || (o.typed && A.canFollow()));
  let src;
  if (follow) src = bg.q[A.turns.length >= 2 ? 3 : 1];
  else if (o.newTopic) src = bg.q[2];
  else src = bg.q[0];
  const t = { ...src, spot: src === bg.q[2] ? "q3" : "q1", state: "think" };
  if (o.typed) t.q = o.typed;
  if (o.err === "screen") { t.saw = false; t.warnCode = "screen"; }
  if (!follow && t !== bg.q[1]) t.saw = src.saw !== false && o.err !== "screen";
  if (follow) t.saw = false; // 追问先只发文字，模型说要看屏幕才发图
  const wasOpen = A.card && !A.card.classList.contains("fade");
  if (!follow) {
    if (o.newTopic && wasOpen && A.turns.length) { A.old.push(A.turns); A.showOld = false; }
    else if (!wasOpen) { A.old = []; }
    A.turns = [];
  }
  A.run.dead = true; const tok = A.run = { dead: false };
  ensureCard(); A.card.classList.remove("listen");
  if (!follow) { const r = spotRect(t.spot); const ox = Math.max(0, Math.min(r.x + r.w, 1268) - Math.max(r.x, 868)), oy = Math.max(0, Math.min(r.y + r.h, 360) - Math.max(r.y, 34)); A.card.classList.toggle("left", ox * oy > r.w * r.h * .35); if (t.saw || o.err === "screen") showCursor(t.spot); }
  A.turns.push(t); A.state = "idle"; paintFoot(); paintBody(); scrollEnd();
  setStatus(o.newTopic && wasOpen ? `<span class="tag">新话题</span> <b>在想</b>` : `<b>${t.saw ? "看着屏幕" : "在想"}</b>${follow ? ` · 第 ${A.turns.length} 问` : ""}`);
  await sleep(o.fast ? 250 : 900); if (tok.dead) return;
  if (o.err && o.err !== "screen") { t.state = "err"; t.err = o.err; fillAns(t); A.doneStatus(); A.onDone && A.onDone(); return; }
  if (t.warnCode === "screen") t.warn = `<div class="warnbar" style="margin-bottom:10px" data-part="没看屏幕">${ICON.screen(15)}<span>这次没看屏幕：还没给屏幕录制权限</span><button class="btn" data-act="grant">去授权</button></div>`;
  if (t.search) { t.state = "search"; fillAns(t); setStatus(`<b>正在联网查</b>`); await sleep(o.fast ? 250 : 1100); if (tok.dead) return; }
  t.state = "stream"; fillAns(t);
  setStatus(`<b>正在回答</b>${A.turns.length > 1 ? ` · 第 ${A.turns.length} 问` : ""}`);
  const text = t.warnCode === "screen" ? "我没看到你的屏幕，只能按字面猜你问的是什么。给了屏幕录制权限后再问一次，我会看着你指的地方回答。" : t.a;
  if (t.warnCode === "screen") t.a = text;
  let ok = true;
  if (o.fast) $(".md", t.el).innerHTML = md(text); else ok = await stream($(".md", t.el), text, tok, scrollEnd);
  if (!ok) return;
  t.state = "done"; fillAns(t); A.doneStatus(); scrollEnd();
  if (A.wantCollapse) { A.wantCollapse = false; A.collapse(); }
  const cb = A.onDone; A.onDone = null; cb && cb();
};
A.act = function (act, t) {
  const q = A.turns[0] ? A.turns[A.turns.length - 1].q : BGS[S.bg].q[0].q;
  if (act === "fillkey") openKeySheet(t.q || q, () => { A.turns.pop(); A.ask({ recorded: true, typed: t.q }); });
  else if (act === "retry") { A.turns.pop(); A.ask({ recorded: true, typed: t.q }); }
  else if (act === "howkey") { const p = t.el.querySelector(".err p"); p.innerHTML = "打开 platform.deepseek.com，登录后在「API Keys」里点「创建」，复制那串 sk- 开头的字。<br>（原型：真机上会用浏览器打开这个网址）"; }
  else if (act === "totype") { A.type(); }
  else if (act === "micset") { openMicSettings(); A.err = null; }
  else if (act === "grant") openDragGrant(() => { t.warn = `<div class="okbar" style="margin-bottom:10px">${ICON.check(15)}<span>能看屏幕了</span><button class="btn" data-act="reask">看着屏幕再问一次</button></div>`; fillAns(t); });
  else if (act === "reask") { A.turns.pop(); A.ask({ recorded: true }); }
};

// ===== 打字问 =====
A.type = function () {
  if (A.rec) return;
  const c = ensureCard();
  if (!A.turns.length) { setStatus(`<b>打字问</b> · 会看着屏幕回答`); $(".bd", c).innerHTML = ""; $(".bd", c).style.display = "none"; }
  const f = $(".ft", c);
  f.outerHTML = `<div class="comp ft" data-part="打字框">${ICON.kbd(16)}<input id="tIn" placeholder="${A.turns.length ? "接着问…" : "问点什么，AI 会看着屏幕回答"}" autocomplete="off"><span class="hint">↩ 发送 · esc 取消</span><button class="snd" id="tGo" disabled>${ICON.send(15)}</button></div>`;
  const inp = $("#tIn", c), go = $("#tGo", c);
  S.typing = true; inp.focus();
  inp.oninput = () => go.disabled = !inp.value.trim();
  const send = () => { const v = inp.value.trim(); if (!v) return; S.typing = false; restoreFoot(); A.ask({ typed: v, recorded: true }); };
  go.onclick = send;
  inp.onkeydown = e => { if (e.key === "Enter" && !e.isComposing) send(); if (e.key === "Escape") { e.stopPropagation(); A.endType(); } };
  inp.onblur = () => { if (!inp.value.trim()) setTimeout(() => { if (S.typing && document.activeElement !== inp) A.endType(); }, 120); };
};
function restoreFoot() { const c = A.card; if (!c) return; const comp = $(".comp", c); if (comp) comp.outerHTML = `<div class="ft" data-part="底栏"></div>`; $(".bd", c).style.display = ""; paintFoot(); }
A.endType = function () { S.typing = false; if (!A.turns.length) { A.close(); return; } restoreFoot(); };

// ===== 报错场景 =====
A.error = async function (code) {
  A.close(true);
  if (code === "mic") {
    const c = ensureCard(); A.turns = [{ q: "", state: "err", err: "mic" }]; setStatus(`<b>没开始录音</b>`);
    $(".bd", c).innerHTML = `<div class="turn cur"><div class="ans"></div></div>`; A.turns[0].el = $(".ans", c); fillAns(A.turns[0]); return;
  }
  const g = A.gen; A.pendingErr = code; A.talkDown("auto"); await sleep(1100); if (g !== A.gen) return; A.rec && A.rec.finish();
};
A.close = function (quiet) {
  A.gen = (A.gen || 0) + 1;
  A.run.dead = true; A.run = { dead: false }; if (A.rec) { clearTimeout(A.rec.auto); A.rec = null; }
  hideCap(); A.footStop && A.footStop(); A.footStop = null;
  if (A.card) { A.card.remove(); A.card = null; }
  hideCursor(); A.turns = []; A.old = []; A.state = "idle"; A.pinned = false; S.typing = false; A.onDone = null;
};
A.escape = function () { if (A.rec) return A.cancelRec(); if (!S.typing) A.close(); };
// 点外面：没钉住就缩成一行，4 秒后淡出；鼠标停上去回满
A.outside = function () {
  if (!A.card || A.pinned || S.typing || A.rec) return;
  const last = A.turns[A.turns.length - 1];
  if (last && last.state !== "done" && last.state !== "err") { A.wantCollapse = true; return; }
  A.collapse();
};
A.collapse = function () {
  if (!A.card) return; A.card.classList.add("strip"); paintHead();
  clearTimeout(A.collapsedTimer); A.collapsedTimer = setTimeout(() => { if (A.card && A.card.classList.contains("strip") && !A.card.matches(":hover")) { A.card.classList.add("fade"); setTimeout(() => { if (A.card && A.card.classList.contains("fade")) A.close(); }, 400); } }, 4000);
};
A.refresh = function () { paintFoot(); updAskBtn(); };
function updAskBtn() { $("#bAsk").textContent = A.canFollow() ? "按住追问" : "按住提问"; $("#bType").textContent = "打字问"; }
setInterval(updAskBtn, 300);

setBg(S.bg); refreshBar(); wireBar(A); updAskBtn(); runScene(A);
</script></body></html>
