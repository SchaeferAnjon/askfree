name: AskFree
options:
  bundleIdPrefix: io.github.schaeferanjon
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  AskFreeCore:
    path: AskFreeCore
  # 自动更新。版本写死，升级时改这里再 xcodegen generate
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  AskFree:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/AskFree.icns
    dependencies:
      - package: AskFreeCore
      - package: Sparkle
    postBuildScripts:
      - name: 重签 Sparkle 的辅助程序
        script: bash "$SRCROOT/scripts/sign_sparkle.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: Ask Free
        EXECUTABLE_NAME: AskFree
        PRODUCT_MODULE_NAME: AskFree
        PRODUCT_BUNDLE_IDENTIFIER: io.github.schaeferanjon.askfree
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/AskFree.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "4"
