name: AskFree
options:
  bundleIdPrefix: io.github.schaeferanjon
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  AskFreeCore:
    path: AskFreeCore
targets:
  AskFree:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/AskFree.icns
    dependencies:
      - package: AskFreeCore
    settings:
      base:
        PRODUCT_NAME: Ask Free
        EXECUTABLE_NAME: AskFree
        PRODUCT_MODULE_NAME: AskFree
        PRODUCT_BUNDLE_IDENTIFIER: io.github.schaeferanjon.askfree
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/AskFree.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
