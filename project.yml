name: AskFree
options:
  bundleIdPrefix: io.github.schaeferanjon
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  AskFreeCore:
    path: AskFreeCore
  # 自动更新。版本写死，升级时改这里再 xcodegen generate
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  AskFree:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/AskFree.icns
      - path: Resources/ThirdPartyNotices.txt
    dependencies:
      - package: AskFreeCore
        product: AskFreeCore
      # 回答正文排版（公式、代码块），带着 SwiftMath
      - package: AskFreeCore
        product: AnswerRender
      # 笔记导出成 HTML：KaTeX（JavaScriptCore）、代码着色、截图内嵌
      - package: AskFreeCore
        product: NotesExport
      - package: Sparkle
    postBuildScripts:
      # 输入写上拷进来的资源包：等它拷完再删（不写的话两步可能同时跑，删完又被拷回来）
      - name: 只留公式用的那套字体
        script: bash "$SRCROOT/scripts/trim_math_fonts.sh"
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/SwiftMath_SwiftMath.bundle
        basedOnDependencyAnalysis: false
      - name: 重签 Sparkle 的辅助程序
        script: bash "$SRCROOT/scripts/sign_sparkle.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: Ask Free
        EXECUTABLE_NAME: AskFree
        PRODUCT_MODULE_NAME: AskFree
        PRODUCT_BUNDLE_IDENTIFIER: io.github.schaeferanjon.askfree
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/AskFree.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "4"
